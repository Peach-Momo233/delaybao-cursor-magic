<svg xmlns="http://www.w3.org/2000/svg" width="108" height="32" viewBox="0 0 25 7" shape-rendering="crispEdges">
  <!-- 三颗爱心都使用相同的 7×7 像素矩阵 -->
  <g>
    <!-- 对称的深粉轮廓 -->
    <path fill="#b94378" d="M1 0h2v1h1V0h2v1h1v3H6v1H5v1H4v1H3V6H2V5H1V4H0V1h1z"/>
    <!-- 内部糖果粉色 -->
    <path fill="#f27fab" d="M1 1h2v1h1V1h2v3H5v1H4v1H3V5H2V4H1z"/>
    <!-- 单格像素高光 -->
    <rect x="1" y="1" width="1" height="1" fill="#ffc9df"/>
  </g>
  <g transform="translate(9 0)">
    <path fill="#b94378" d="M1 0h2v1h1V0h2v1h1v3H6v1H5v1H4v1H3V6H2V5H1V4H0V1h1z"/>
    <path fill="#f27fab" d="M1 1h2v1h1V1h2v3H5v1H4v1H3V5H2V4H1z"/>
    <rect x="1" y="1" width="1" height="1" fill="#ffc9df"/>
  </g>
  <g transform="translate(18 0)">
    <path fill="#b94378" d="M1 0h2v1h1V0h2v1h1v3H6v1H5v1H4v1H3V6H2V5H1V4H0V1h1z"/>
    <path fill="#f27fab" d="M1 1h2v1h1V1h2v3H5v1H4v1H3V5H2V4H1z"/>
    <rect x="1" y="1" width="1" height="1" fill="#ffc9df"/>
  </g>
</svg>
